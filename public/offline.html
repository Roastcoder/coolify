<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f0d">
    <title>Offline | StandaloneCoders Cloud</title>
    <style>
        :root { color-scheme: dark light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
            background: #0b0f0d;
            color: #f3f4f0;
            font: 16px/1.55 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            text-align: center;
        }
        main { max-width: 340px; }
        img { width: 64px; height: 64px; }
        h1 { margin: 20px 0 8px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
        p { margin: 0 0 24px; color: #98a294; }
        button {
            min-height: 48px;
            padding: 0 28px;
            border: 0;
            border-radius: 12px;
            background: #befa49;
            color: #101613;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        button:focus-visible { outline: 2px solid #befa49; outline-offset: 3px; }
        @media (prefers-color-scheme: light) {
            body { background: #f4f5f0; color: #101613; }
            p { color: #4f584c; }
            button { background: #4d7c0f; color: #fff; }
            button:focus-visible { outline-color: #4d7c0f; }
        }
    </style>
</head>

<body>
    <main>
        <img src="/standalonecoders-mark.svg" alt="">
        <h1>You're offline</h1>
        <p>StandaloneCoders Cloud needs a connection to show your servers and apps. Check your network and try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
    </main>
</body>

</html>
