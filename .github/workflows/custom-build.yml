name: Custom - Build Coolify Image

# Builds this fork's Coolify into ghcr.io/<owner>/coolify so a self-hosted
# instance can run our customized version instead of the official image.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - templates/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-build
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: aarch64
            platform: linux/aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Record build commit for the Update button
        run: sed -i "s/'sha' => null,/'sha' => '${GITHUB_SHA}',/" config/custom_build.php && grep -q "${GITHUB_SHA}" config/custom_build.php

      - name: Resolve image name and version
        id: version
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/coolify" >> "$GITHUB_OUTPUT"
          BASE_VERSION=$(docker run --rm -v "$(pwd):/app" -w /app php:8.2-alpine3.16 php bootstrap/getVersion.php)
          echo "version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            COOLIFY_VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ${{ steps.version.outputs.image }}:${{ github.sha }}-${{ matrix.arch }}

  merge-manifest:
    runs-on: ubuntu-24.04
    needs: build-push
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-arch tags
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/coolify"
          docker buildx imagetools create \
            "${IMAGE}:${GITHUB_SHA}-amd64" \
            "${IMAGE}:${GITHUB_SHA}-aarch64" \
            --tag "${IMAGE}:${GITHUB_SHA::7}" \
            --tag "${IMAGE}:latest"
