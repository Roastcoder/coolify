# Copy to /data/coolify/source/docker-compose.custom.yml on your server (custom/install.sh does it).
# Coolify loads this file on top of its own compose files, so the instance runs
# StandaloneCoders Cloud instead of the official coollabsio/coolify image.
services:
  coolify:
    image: "ghcr.io/roastcoder/standalonecoders-cloud:latest"
    pull_policy: always
